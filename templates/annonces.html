<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Annonces – AmuFound</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/annonces.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/header.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/footer.css') }}" />
</head>
<body>
  {% include 'header.html' %}

  <main class="annonces-main">
  <div class="annonces-container">

    <!-- Hero Section -->
    <div class="annonces-hero">
      <div class="hero-text">
        <h1>
          Recherche d'objets
          <span class="highlight" id="mode-label">perdus</span>
          sur le campus de Luminy
        </h1>
        <p class="hero-sub">Consultez les objets retrouvés sur le campus.</p>
      </div>
      <div class="toggle-switch">
        <button class="toggle-btn active" id="btn-perdu" onclick="setMode('perdu')">Perdu</button>
        <button class="toggle-btn" id="btn-trouve" onclick="setMode('trouve')">Trouvé</button>
      </div>
    </div>

    <!-- Search Bar -->
    <div class="search-bar-wrapper">
      <div class="search-bar">
        <span class="search-icon">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </span>
        <input type="text" id="search-input" placeholder="Recherchez par catégorie, location, description…" oninput="filterCards()" />
      </div>
    </div>

    <!-- Filters -->
    <div class="filters-box">
      <div class="filter-row">
        <span class="filter-label">Category</span>
        <div class="filter-tags" id="filter-category">
          <button class="tag active" data-filter="category" data-value="Clés" onclick="toggleFilter(this)">🔑 Clés</button>
          <button class="tag" data-filter="category" data-value="Carte" onclick="toggleFilter(this)">🪪 Carte</button>
          <button class="tag" data-filter="category" data-value="Phone" onclick="toggleFilter(this)">📱 Phone</button>
          <button class="tag" data-filter="category" data-value="Sac" onclick="toggleFilter(this)">👜 Sac</button>
          <button class="tag" data-filter="category" data-value="Habit" onclick="toggleFilter(this)">👕 Habit</button>
          <button class="tag" data-filter="category" data-value="Autre" onclick="toggleFilter(this)">📦 Autre</button>
        </div>
      </div>
      <div class="filter-row">
        <span class="filter-label">Localisation</span>
        <div class="filter-tags" id="filter-localisation">
          <button class="tag" data-filter="localisation" data-value="RU" onclick="toggleFilter(this)">RU</button>
          <button class="tag" data-filter="localisation" data-value="TPR1" onclick="toggleFilter(this)">TPR1</button>
          <button class="tag" data-filter="localisation" data-value="TPR2" onclick="toggleFilter(this)">TPR2</button>
          <button class="tag" data-filter="localisation" data-value="BAT A" onclick="toggleFilter(this)">BAT A</button>
          <button class="tag" data-filter="localisation" data-value="BAT B" onclick="toggleFilter(this)">BAT B</button>
          <button class="tag" data-filter="localisation" data-value="Technoforme" onclick="toggleFilter(this)">Technoforme</button>
          <button class="tag" data-filter="localisation" data-value="Hexagone" onclick="toggleFilter(this)">Hexagone</button>
          <button class="tag" data-filter="localisation" data-value="Autre" onclick="toggleFilter(this)">Autre</button>
        </div>
      </div>
      <div class="filter-clear-row">
        <button class="clear-filters" onclick="clearFilters()">Effacer tous les filtres</button>
      </div>
    </div>

    <!-- Cards Grid -->
    <div class="cards-grid" id="cards-grid">
      <!-- Cards injected by JS -->
    </div>

    <!-- Empty state -->
    <div class="empty-state" id="empty-state" style="display:none;">
      <div class="empty-icon">🔍</div>
      <p>Aucune annonce ne correspond à vos filtres.</p>
    </div>

  </div>
</main>

{% include 'footer.html' %}

<script src="{{ url_for('static', filename='js/annonces.js') }}"></script>
</body>
